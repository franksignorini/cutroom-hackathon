<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Cutroom film</title>
<!-- The Cutroom film: one page that turns film.json (the Director's plan) into shots, with the studio's kit (../../lib).
     Each beat names a recipe (statement, world, slams, card, rush, drop, title) or "custom": shots/<beat>.js, written by
     the Builder agent. A custom shot that fails to load or throws falls back to its recipe and reports [shot <name>] on
     the console, which render.mjs prints as a [page error] for the pipeline. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
</head>
<body>
<canvas id="c"></canvas>
<script type="module">
import * as motion from '../../lib/motion.js';
import * as draw from '../../lib/draw.js';
import * as atmos from '../../lib/atmos.js';
import * as particles from '../../lib/particles.js';
import * as space from '../../lib/space.js';
import * as captions from '../../lib/captions.js';
import * as hud from '../../lib/hud.js';
import { finish } from '../../lib/post.js';
import { studio, sequence } from '../../lib/studio.js';
import { setTheme, rgba } from '../../lib/theme.js';
import { frame } from '../../lib/layout.js';
import { withTransitions } from '../../lib/transitions.js';
import { cast } from '../../lib/type.js';

const { clamp, lerp, win, cine, sp, impactShake, rng } = motion;
const { camera, project, text, dropIn, fitSize, font } = draw;
// A line set glyph by glyph has a quarter-em space, and in a serif the words ran together ("DON'T LOOK DOWN", SUMMIT;
// "UPWARDUNTIL", CRUX): the recipes set their lines with a wider gap.
// Only where the face's space is narrow (under 0.24 em): doubled everywhere, SIGNAL 0 stood as "SIGNAL     0" (2026-10-17).
const letters = (g, str, x, y, o = {}, ...rest) => {
  g.save(); g.font = font(o.weight ?? '700', 100, o.family ?? T.text.family); const sp = g.measureText(' ').width; g.restore();
  // tracked lines are already open (one more glyph adds a tracking step too); a monospaced face's space is a whole
  // letter wide ("NOODLE    88", 2026-10-17): there a quarter-em space stands in
  if (sp > 45) return draw.letters(g, String(str).replace(/ /g, ' '), x, y, o, ...rest);
  const narrow = sp < 24 && (o.tracking ?? 0) < 0.03;

  return draw.letters(g, narrow ? String(str).replace(/ /g, '  ') : str, x, y, o, ...rest);
};
const { beam, godRays, fog, dust, rain, snow, smoke, lightLeak, flare, gateWeave, bokeh } = atmos;
const { embers, sparks } = particles;
const { phrase } = captions;

// A radius that dips below zero for one frame (an easing overshoot, t = 0) throws in arc() and kills the whole shot:
// three hand-written shots on 2026-10-16, each a paid retry. Negative radii draw nothing instead; NaN still throws so
// the Builder hears about real bugs.
{

  P.arc = function (x, y, r, ...rest) { return arc.call(this, x, y, pos(r), ...rest); };

}
// Text partly outside the picture (the frame edge or the letterbox bar) is moved inside it, however it was drawn: the

// lamp, and when the Critic cut one the first word sat above the frame, so "LIGHTS FAIL" showed only FAIL. Only the

    const m = g.getTransform();

    const pad = 0.015 * cw;

  const told = new Set();
  // the beat word in a drawn string, in the middle of a hand-written shot (35-90% of the beat), or null
  const beatWord = (str) => {
    if (!CUR || CUR.b.kind !== 'custom' || CUR.lt < CUR.b.dur * 0.35 || CUR.lt > CUR.b.dur * 0.9) return null;
    const said = String(str).toUpperCase().replace(/[^\p{L}\p{N}]+/gu, ' ').trim().split(' ');
    return [...(CUR.b.words ?? []), CUR.b.sub ?? ''].flatMap((w) => String(w).toUpperCase().split(/\s+/))
      .map((w) => w.replace(/[^\p{L}\p{N}]/gu, '')).find((w) => w.length >= 2 && said.includes(w)) ?? null;
  };

  const overlap = (g, str, l, t, r, b, color = typeof g.fillStyle === 'string' ? g.fillStyle : null) => {
    const word = g.globalAlpha > 0.3 ? beatWord(str) : null;
    if (!word) return;
    const boxes = (CUR.boxes ??= []);

      if (o.word === word) continue;
      const iw = Math.min(r, o.r) - Math.max(l, o.l), ih = Math.min(b, o.b) - Math.max(t, o.t);
      const key = `${CUR.b.name}~${o.word}~${word}`;
      if (iw > 0 && ih > 0 && iw * ih > 0.08 * Math.min((r - l) * (b - t), (o.r - o.l) * (o.b - o.t)) && !told.has(key)) {
        told.add(key);
        console.error(`[shot ${CUR.b.name}] overlap: "${o.word}" and "${word}" are drawn on top of each other ${CUR.lt.toFixed(2)} s into the shot: give every word of k.beat.words its own place, or show them one at a time, each replacing the last`);
      }
    }

    for (const o of CUR.icons ?? []) {

      if (iw > 0 && ih > 0 && iw * ih > 0.15 * (r - l) * (b - t) && !told.has(`${CUR.b.name}#${word}`)) {
        told.add(`${CUR.b.name}#${word}`);
        console.error(`[shot ${CUR.b.name}] covered: "${word}" is drawn on top of an icon ${CUR.lt.toFixed(2)} s into the shot: an icon behind words must be faint (alpha under 0.5), or give them separate places`);
      }

    const word = beatWord(str);

    console.error(`[shot ${CUR.b.name}] off-frame: "${word}" is drawn outside the picture ${CUR.lt.toFixed(2)} s into the shot: lay out the words from k.beat.words, however many there are, inside the frame`);
  };
  // A word drawn glyph by glyph (the kit's letters()) is checked whole: each glyph alone is no beat word, so PALEO's
  // shot (2026-10-17) drew its sub straight across WORLD and nothing was reported. Box in the caller's space.
  EDGE.word = (g, str, l, t, r, b, color) => {
    const cw = g.canvas.width, ch = g.canvas.height;
    if (!EDGE.on || Math.abs(cw / ch - EDGE.aspect) > 0.01 || ch < 100) return;
    const m = g.getTransform();
    if (!upright(m)) return;
    const L = m.a * l + m.e, R = m.a * r + m.e, T = m.d * t + m.f, B = m.d * b + m.f;

  const NOWORDS = new URLSearchParams(location.search).get('words') === 'off';

}
const PLAN = await (await fetch('film.json', { cache: 'no-store' })).json();
const L = frame(), { W, H } = L, U = L.unit, S = L.safe;
{ const bar = PLAN.look.letterbox ? Math.max(0, (H - W / 2.39) / 2) : 0; Object.assign(EDGE, { on: true, lo: (bar + 6 * U) / H, hi: (H - bar - 6 * U) / H, aspect: W / H }); }
const C = setTheme({ ink: PLAN.look.ground, bone: PLAN.look.text, dim: '#6E6A64', accent: PLAN.look.accent, palette: [] });
const BEAT = 60 / PLAN.bpm;
const T = await cast(PLAN), D = T.display;

// ---------------------------------------------------------------- the film's own system (lib/casting.mjs in the crew)
// The ground can be dark, paper or a bold colour; light in the frame is tinted by the film's palette, never the
// studio's default warm orange (2026-10-16: every trailer read orange through the beam, the leak and the embers).
const hexRgb = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));

const GLOW = LIGHT ? C.accent : mix(C.bone, C.accent, 0.3);
const STYLE = { cuts: ['zoom', 'luma'], hookAir: 'beam', titleAir: 'embers', ...(PLAN.style ?? {}) };
// Where the type sits: centred, flush left (editorial) or low under an open frame.
const LAY = PLAN.look.layout ?? 'centre';
// flush left keeps 7% of the safe width: at 3% the camera's push-in carried a sub past the edge ("A BRITISH HOUSE", 2026-10-17)
const AX = LAY === 'left' ? { x: S.x + S.w * 0.07, align: 'left' } : { x: L.cx, align: 'center' };
const yAt = (f) => S.y + S.h * (LAY === 'low' ? Math.max(f, 0.64) : f);

// ---------------------------------------------------------------- icons (lib/icons.mjs in the crew)
// Vector icons of the things the Director named, fetched from Iconify into icons/, drawn as silhouettes tinted in the
// film's colours. The first is the subject: the drop and the world show it unless a beat names another.
const ICONS = {}, OBJ = {};
// OBJ: the same things as lit 3D objects (Microsoft Fluent Emoji 3D, MIT), drawn in their own colours, never tinted

  const im = new Image();
  im.onload = () => { into[word] = im; ok(); };
  im.onerror = () => { console.warn(`[icon ${word}] ${src} does not load`); ok(); };
  im.src = src;

// Not in a horror film: the 3D objects are emoji, cheerful by design (a candy-blue elevator in THE QUIET FLOOR, 2026-10-16).
const OBJ_OK = PLAN.family !== 'dread';
await Promise.all((PLAN.icons ?? []).flatMap((i) => [i.file && load(i.file, i.word, ICONS), OBJ_OK && i.obj && load(i.obj, i.word, OBJ)].filter(Boolean)));

// How solid each icon is: the share of its own bounding box it covers. A silhouette needs mass: mdi:aurora (thin
// wavy lines, 0.45) drawn dark on the drop's disc read as a black comb (AURORA, 2026-10-16); the train (0.70) and the
// compass (0.66) read fine.

  const x2 = c.getContext('2d'); x2.drawImage(im, 0, 0, 96, 96);

const MOTIF = (PLAN.icons ?? []).map((i) => i.word).find((w) => ICONS[w]);
// The subject as a 3D object: the Director's first named thing, when it has one (only when it has no flat icon, another
// 3D thing: "the first with a 3D render" put a sun over a fire festival's name, 2026-10-16).
// The first named thing wins when it has a 3D render, flat icon or not: SWAN (2026-10-17) had no flat swan, so the
// first flat icon ("ice") became the motif and an ice cube stood over the ballet's name.
const FIRST = PLAN.icons?.[0]?.word;
const HERO = FIRST && OBJ[FIRST] ? FIRST : MOTIF ? (OBJ[MOTIF] ? MOTIF : null) : (PLAN.icons ?? []).map((i) => i.word).find((w) => OBJ[w]);
/** A 3D object, centred on x, y, `size` px tall and wide, in its own colours. */

const TINTED = new Map();

// A beat's icon behind its words: big, faint, slowly turning; the drop and the world fall back on the subject.

// ---------------------------------------------------------------- air: the weather of a shot

// vignette made the paper look grey and dirty: SPROUT, 2026-10-16).
let CUR = null;

// A real photo under a beat (Pixabay, fetched by the crew into photos/): cover-fit, a slow push and drift, graded into the

// everything on top: the photo is a material, like the icons.

const ground = (g, c = C.ink) => {

    if (!o.color || hiddenTold.has(key) || o.alpha < 0.9 || subWordsOf(CUR.b).has(o.word)) continue;

const CUSTOM = {};

  try { CUSTOM[b.name] = (await import(`./shots/${b.name}.js?v=${PLAN.rev ?? 0}`)).default; }
  // "k is not defined" twice in five free films (2026-10-17): the kit used outside draw(); the message says where it lives
  catch (e) { console.error(`[shot ${b.name}] does not load: ${e.message}${/^k is not defined/.test(e.message) ? ': k (the kit) exists only inside draw(g, t, k): move every line that reads k. into the function body, nothing at the top of the module but constants' : ''}`); }
}
const failed = new Set();
// Every shot moves for its whole length: a frame that lands and then holds read as a slide (2026-10-16, both test
// trailers: 3 of 4 frames per beat identical). One camera move per beat, never the same twice in a row; the zoom
// stays above 1 so a drift never shows the frame's edge. The drop barely moves: it is the held breath.
const MOVES = [
  (p) => ({ zoom: 1 + 0.07 * p }),                                         // push in
  (p) => ({ zoom: 1.08 - 0.07 * p }),                                      // pull out
  (p) => ({ zoom: 1.05, x: (0.5 - p) * 60 * U }),                          // drift left
  (p) => ({ zoom: 1.05, x: (p - 0.5) * 60 * U, rot: (p - 0.5) * 0.006 }),  // drift right, a touch of roll
